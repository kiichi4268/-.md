name: Check SNS Tokens

# 毎週月曜 9:07（JST）に Instagram・Threads のアクセストークンを確認する。
# 無効、または期限まで14日を切っているとジョブが失敗し、GitHub から通知メールが届く。
on:
  schedule:
    - cron: "7 0 * * 1"   # UTC 0:07 = JST 9:07
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tokens
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          THREADS_TOKEN_EXPIRES_ON: ${{ vars.THREADS_TOKEN_EXPIRES_ON }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v23.0' }}
          WARN_DAYS: 14
        run: python scripts/check_tokens.py
